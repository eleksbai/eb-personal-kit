name: Publish to PyPI

# Trigger a publish when a v* tag is pushed; version is derived from the tag by hatch-vcs (v1.2.3 -> 1.2.3)
on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for Trusted Publishing (OIDC), PyPI's recommended tokenless publishing method
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          # hatch-vcs needs the full history and tags to compute the version
          fetch-depth: 0

      - name: Verify tag format
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! echo "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]{6}(\.[0-9]+)?$'; then
            echo "::error::Tag '${TAG}' does not match v<major>.<minor>.<YYMMDD>[.<n>], e.g. v0.1.260930"
            exit 1
          fi

      - name: Verify tag points to master HEAD
        run: |
          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/master)" ]; then
            echo "::error::Tag does not point to the latest master commit; refusing to publish an outdated version"
            exit 1
          fi

      - uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Lint
        run: uv run ruff check

      - name: Run tests
        run: uv run pytest

      - name: Build distributions
        run: uv build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
