[build-system]
requires = ["hatchling>=1.26", "hatch-vcs>=0.4"]
build-backend = "hatchling.build"

[project]
name = "eb-personal-kit"
description = "A collection of handy tools"
readme = "README.md"
license = "MIT"
authors = [{ name = "eleksbai", email = "eleksbai@qq.com" }]
keywords = ["ddns",  "monitor",  "theme",  "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: System Administrators",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: Name Service (DNS)",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.11"
dynamic = ["version"]
dependencies = [
    "astral>=3.2",
    "click>=8.5.0",
    "cryptography>=50.0.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pydantic-settings>=2.6",
    "requests>=2.31",
    "tencentcloud-sdk-python>=3.0.1103",
]

[project.urls]
Homepage = "https://github.com/eleksbai/eb-tools"
Repository = "https://github.com/eleksbai/eb-tools"
Issues = "https://github.com/eleksbai/eb-tools/issues"

[project.scripts]
eb = "eb_personal_kit.cli:main"
eb-ddns = "eb_personal_kit.ddns.cli:main"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.1.0"

[tool.hatch.build.hooks.vcs]
version-file = "src/eb_personal_kit/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/eb_personal_kit"]

[dependency-groups]
dev = [
    "pre-commit>=4.0",
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
