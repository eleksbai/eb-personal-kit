[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[project]
name = "eb-tools"
version = "0.1.0"
description = "A collection of handy tools"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.0",
    "cryptography>=50.0.1",
    "httpx>=0.28.1",
    "psutil>=7.2.2",
    "pydantic-settings>=2.6",
    "requests>=2.31",
    "tencentcloud-sdk-python>=3.0.1103",
]

[project.scripts]
eb = "eb_tools.cli:main"
eb-ddns = "eb_tools.ddns.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
]
